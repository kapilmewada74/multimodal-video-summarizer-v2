name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install system packages (ffmpeg, PostgreSQL for the database tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql
      - run: pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes backend
      - name: Tests (includes a real PostgreSQL for schema, security-policy and queue tests)
        env:
          REQUIRE_POSTGRES: "1"
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (production, high severity)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
