name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install system packages (ffmpeg, PostgreSQL for the database tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql
      - run: pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes backend scripts
      - name: Tests (includes a real PostgreSQL for schema, security-policy and queue tests)
        env:
          REQUIRE_POSTGRES: "1"
        run: python -m pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (production, high severity)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    # Proves the images still build and the production stack file is valid, before anything is published.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API/worker image
        uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile, push: false, load: true, tags: summarizer-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: summarizer-web:ci
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The API refuses an unsafe production configuration
        run: |
          if docker run --rm -e DATABASE_URL=x summarizer-api:ci python -c "import logging; from summarizer.core.config import get_settings; from summarizer.core.startup_checks import enforce; enforce(get_settings(), logging.getLogger())"; then
            echo "expected the start-up checks to refuse an incomplete production configuration"; exit 1
          fi
      - name: Validate the production compose file
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config -q
